[env:crowpanel_advance_7]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/2024.07.00/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CrowPanel Advance 7.0 V1.5
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; create LittleFS fliesystem
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^6.21.5

monitor_speed = 115200
monitor_port = COM3
monitor_filters = esp32_exception_decoder       ; added this line to debug front crashing
upload_speed = 460800

platform_packages =
    framework-arduinoespressif32-libs@symlink://C:/Users/marti/OneDrive/Documents/PlatformIO/Projects/Scroller/packages/framework-arduinoespressif32-libs